# Instance-repo ansible.cfg — loaded automatically when you run playbooks from
# the repo root (the documented invocation: `ansible-playbook -i ansible/hosts
# scaffold/ansible/<play>.yml`). The scaffold ships the same settings in
# scaffold/ansible/ansible.cfg, but Ansible only auto-loads a config from the
# CURRENT directory, not the playbook's directory — so without this file the
# transport-resilience settings silently do not apply from the repo root.
# Discovered in the 2026-07-06 rebuild drill.
[defaults]
timeout = 60

[ssh_connection]
# Budget/overseas VPS routes drop SSH channels mid-run. Pipelining removes
# per-task sftp (the first casualty) and halves round-trips; ServerAlive makes
# a dead channel fail in ~60s instead of hanging the play forever; retries let
# it self-heal. See scaffold/docs/09-recovery.md.
pipelining = True
ssh_args = -C -o ControlMaster=auto -o ControlPersist=120s -o ServerAliveInterval=15 -o ServerAliveCountMax=4
retries = 5
