name: Secret Scan

# This repo is the live config for a box: a committed credential is an
# immediate compromise. On a free-plan private repo GitHub's push protection
# is not available, and most commits to main are direct operator pushes, so
# the scan runs on every push to main as well as on every PR, weekly, and on
# demand. It takes seconds. The job lives in the scaffold
# (scaffold/.github/workflows/server-secret-scan.yml).

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  gitleaks:
    uses: uppertoe/vps-base-template/.github/workflows/server-secret-scan.yml@4275da66f2922b931cc8843ac96630dc5bffcb67
