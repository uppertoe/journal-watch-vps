name: Digest Freshness

# Weekly truth-check on the supply-chain pins: compares every image:tag@sha256
# against the registry's current digest for that tag and raises/updates an
# issue on drift. With the Renovate app enabled, drift arrives as bump PRs
# instead and this stays green — either way a stale pin cannot be silent.

on:
  schedule:
    - cron: "37 19 * * 0"   # weekly, Sun 19:37 UTC (Mon 05:37 AEST)
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  digest-freshness:
    name: Compare pinned digests to registry
    runs-on: ubuntu-latest
    # The template's pins are examples that no server runs; Renovate PRs keep
    # them current, and the check only means something in a stamped instance.
    if: github.repository != 'uppertoe/server-instance-template'
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Sync scaffold submodule
        run: |
          git config --global url."https://github.com/".insteadOf git@github.com:
          git submodule sync --recursive
          git submodule update --init --recursive

      - name: Check digest freshness
        id: fresh
        env:
          # Resolve PRIVATE first-party images instead of the anonymous WARN.
          # GHCR_READ_TOKEN (a read:packages PAT, the same one the container scan
          # uses) when the repo has it; otherwise GITHUB_TOKEN, which covers the
          # packages linked to this repo. Anything still unreadable stays a WARN.
          GHCR_USER: ${{ github.repository_owner }}
          GHCR_TOKEN: ${{ secrets.GHCR_READ_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          # Report-only: these pins are auto-bumped by Renovate, so a transient
          # digest lag between a rebuild and its bump PR must not page us with a red
          # run every week. Capture drift WITHOUT failing the step; the issue below
          # is the durable, non-silent signal (opened on drift, closed when fresh).
          # pipefail, or the pipeline's status is tee's and drift is never seen.
          set -o pipefail
          if bash scripts/check-digest-freshness.sh | tee freshness.txt; then
            echo "drift=0" >> "$GITHUB_OUTPUT"
          else
            echo "drift=1" >> "$GITHUB_OUTPUT"
          fi

      - name: Sync drift issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Pinned image digests have drifted"
          existing="$(gh issue list --state open --search "$title in:title" --json number --jq '.[0].number' || true)"
          if [ "${{ steps.fresh.outputs.drift }}" = "1" ]; then
            body="$(printf 'Weekly digest-freshness check found drift:\n\n```\n%s\n```\n\nRenovate normally bumps these within a day, so a single run is usually just a rebuild-vs-bump lag. If this issue keeps getting comments across runs, a pin is genuinely stale — update it (test, then commit) or check the Renovate app.\n' "$(cat freshness.txt)")"
            if [ -n "$existing" ]; then
              gh issue comment "$existing" --body "$body"
            else
              # gh refuses unknown labels, which would swallow the alert on a
              # fresh repo — ensure the label exists first (idempotent).
              gh label create security --color B60205 \
                --description "Automated security/drift alerts" --force || true
              gh issue create --title "$title" --body "$body" --label security
            fi
          elif [ -n "$existing" ]; then
            gh issue comment "$existing" --body "Pins are fresh again as of this run — auto-closing."
            gh issue close "$existing"
          fi
